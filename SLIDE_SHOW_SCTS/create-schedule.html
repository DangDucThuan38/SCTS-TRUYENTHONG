<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết Lập Lịch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .form-card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-xl">
    <div class="form-card p-8">
        <h1 id="formTitle" class="text-2xl font-bold text-slate-800 mb-2">Thêm Lịch Mới</h1>
        <p id="siteTag" class="text-blue-600 text-xs font-bold uppercase mb-8"></p>

        <form id="scheduleForm" class="space-y-4">
            <input type="hidden" id="scheduleId">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Nhân sự</label>
                <input type="text" id="nhanSu" required class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Nội dung</label>
                <textarea id="noiDung" required rows="2" class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Từ ngày</label>
                    <input type="datetime-local" id="tuNgay" required class="w-full px-4 py-2 rounded-lg border border-slate-200 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Đến ngày</label>
                    <input type="datetime-local" id="denNgay" required class="w-full px-4 py-2 rounded-lg border border-slate-200 text-sm">
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Địa điểm</label>
                <input type="text" id="diaDiem" required class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Trạng thái</label>
                <select id="trangThai" class="w-full px-4 py-2 rounded-lg border border-slate-200 bg-white">
                    <option value="3">Chưa bắt đầu</option>
                    <option value="1">Đang thực hiện</option>
                    <option value="2">Đã hoàn thành</option>
                </select>
            </div>
            <div class="flex gap-3 pt-4">
                <button type="button" onclick="location.href='list-schedule.html'" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl">Hủy</button>
                <button type="submit" id="submitBtn" class="flex-[2] py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-100">Xác nhận Lưu</button>
            </div>
        </form>
    </div>
</div>

<script src="env.js"></script>
<script src="common.js"></script>
<script>
    const $ = (id) => document.getElementById(id);
    const editId = new URLSearchParams(location.search).get('id');
    const FIELDS = ['nhanSu', 'noiDung', 'diaDiem', 'trangThai'];
    const DATE_FIELDS = ['tuNgay', 'denNgay'];

    $('siteTag').innerText = `Đơn vị: ${getSite()}`;

    async function loadDetail() {
        if (!editId) return;
        $('formTitle').innerText = 'Chỉnh Sửa Lịch';

        const res = await apiFetch(ENV.API.GET_CONGTAC);
        const item = (await res.json()).find(x => x.id == editId);
        if (!item) return;

        $('scheduleId').value = item.id;
        FIELDS.forEach(f => $(f).value = item[f]);
        DATE_FIELDS.forEach(f => $(f).value = item[f].substring(0, 16));
    }

    $('scheduleForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = $('submitBtn');
        btn.disabled = true;
        btn.innerText = 'Đang lưu...';

        const body = { id: $('scheduleId').value || 'string' };
        [...FIELDS, ...DATE_FIELDS].forEach(f => body[f] = $(f).value);

        try {
            const res = await apiFetch(ENV.API.SAVE_CONGTAC, { method: 'POST', body });
            if (res.ok) {
                alert('Thành công!');
                location.href = 'list-schedule.html';
                return;
            }
            alert('Lưu thất bại!');
        } catch {
            alert('Lỗi kết nối!');
        }
        btn.disabled = false;
        btn.innerText = 'Xác nhận Lưu';
    };

    document.addEventListener('DOMContentLoaded', loadDetail);
</script>
</body>
</html>
