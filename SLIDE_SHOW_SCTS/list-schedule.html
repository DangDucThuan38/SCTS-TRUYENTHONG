<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch làm việc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: white; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .status-pill { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .drag-handle { cursor: grab; color: #cbd5e1; }
        .drag-handle:active { cursor: grabbing; }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
        <div class="flex items-center gap-4">
            <button onclick="location.href='home.html'" class="p-2.5 text-slate-500 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 hover:text-blue-600 transition-all shadow-sm group">
                <svg class="w-6 h-6 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Lịch làm việc</h1>
                <p id="siteSubtitle" class="text-slate-500 text-sm">Kế hoạch công việc</p>
            </div>
        </div>

        <button onclick="location.href='create-schedule.html'" class="flex items-center justify-center px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all shadow-lg shadow-blue-200 active:scale-95">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Thêm Lịch Mới
        </button>
    </div>

    <div class="glass-card p-4 mb-6 flex flex-wrap gap-4 items-end">
        <div class="flex-1 min-w-[200px]">
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Tìm kiếm</label>
            <input type="text" id="searchInput" oninput="filterTable()" placeholder="Tên cán bộ, nội dung..." class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div class="w-full md:w-48">
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Trạng thái</label>
            <select id="statusFilter" onchange="filterTable()" class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none text-sm bg-white">
                <option value="">Tất cả</option>
                <option value="1">Đang thực hiện</option>
                <option value="2">Đã hoàn thành</option>
                <option value="3">Chưa bắt đầu</option>
            </select>
        </div>
    </div>

    <div class="glass-card overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-100">
                        <th class="px-4 py-4 w-12"></th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Nhân sự</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Nội dung</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Thời gian</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Địa điểm</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Trạng thái</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="scheduleTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="env.js"></script>
<script src="common.js"></script>
<script>
    const COLS = 7;
    const STATUS = {
        '1': { text: 'Đang công tác', cls: 'bg-emerald-100 text-emerald-700' },
        '2': { text: 'Hoàn thành',    cls: 'bg-blue-100 text-blue-700' },
        '3': { text: 'Chưa bắt đầu',  cls: 'bg-slate-100 text-slate-500' }
    };
    const getStatus = (v) => STATUS[v] || STATUS['3'];

    const tbody = document.getElementById('scheduleTableBody');
    let allSchedules = [];

    const messageRow = (text, extra = '') =>
        `<tr><td colspan="${COLS}" class="p-8 text-center text-slate-400 ${extra}">${text}</td></tr>`;

    async function loadData() {
        const site = getSite();
        document.getElementById('siteSubtitle').innerText = `Kế hoạch công tác đơn vị ${site}`;
        tbody.innerHTML = messageRow(`Đang tải dữ liệu đơn vị ${site}...`);

        try {
            const res = await apiFetch(ENV.API.GET_CONGTAC);
            if (!res.ok) throw new Error('Lỗi API');
            allSchedules = await res.json();
            allSchedules.sort((a, b) => (parseInt(a.viTri) || 0) - (parseInt(b.viTri) || 0));
            filterTable();
        } catch (err) {
            console.error(err);
            tbody.innerHTML = messageRow(`Không tìm thấy dữ liệu cho đơn vị ${site}`, 'italic');
        }
    }

    const rowHtml = (item) => {
        const st = getStatus(item.trangThai);
        return `
        <tr class="hover:bg-slate-50 transition-colors" data-id="${item.id}">
            <td class="px-4 py-4 text-center">
                <div class="drag-handle hover:text-blue-500 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                </div>
            </td>
            <td class="px-6 py-4 font-semibold text-slate-800">${item.nhanSu || ''}</td>
            <td class="px-6 py-4 text-slate-600 max-w-xs whitespace-normal break-words">${item.noiDung || ''}</td>
            <td class="px-6 py-4 text-slate-700">
                <div class="flex flex-col gap-1">
                    <div class="flex items-center gap-2">
                        <span class="text-blue-600 font-bold text-sm">${formatTime(item.tuNgay)}</span>
                        <span class="text-slate-400 text-xs">${formatDate(item.tuNgay)}</span>
                    </div>
                    <div class="text-slate-300 text-[10px] ml-1">↓</div>
                    <div class="flex items-center gap-2">
                        <span class="text-slate-700 font-bold text-sm">${formatTime(item.denNgay)}</span>
                        <span class="text-slate-400 text-xs">${formatDate(item.denNgay)}</span>
                    </div>
                </div>
            </td>
            <td class="px-6 py-4 text-slate-600">${item.diaDiem || ''}</td>
            <td class="px-6 py-4"><span class="status-pill ${st.cls}">${st.text}</span></td>
            <td class="px-6 py-4 text-center">
                <button onclick="location.href='create-schedule.html?id=${item.id}'" class="text-blue-500 hover:text-blue-700 font-medium mx-1">Sửa</button>
                <button onclick="deleteItem('${item.id}')" class="text-red-400 hover:text-red-600 font-medium mx-1">Xóa</button>
            </td>
        </tr>`;
    };

    function renderTable(data) {
        tbody.innerHTML = data.length ? data.map(rowHtml).join('') : messageRow('Danh sách trống', 'italic');
    }

    function filterTable() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const status = document.getElementById('statusFilter').value;
        renderTable(allSchedules.filter(x =>
            ((x.nhanSu || '').toLowerCase().includes(search) || (x.noiDung || '').toLowerCase().includes(search)) &&
            (status === '' || x.trangThai === status)
        ));
    }

    // Kéo thả: khởi tạo 1 lần (tbody không bị thay thế nên không cần tạo lại)
    Sortable.create(tbody, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'bg-blue-50',
        onEnd: async ({ item, oldIndex, newIndex }) => {
            if (oldIndex === newIndex) return;
            item.style.opacity = '0.5';
            await changePosition(item.dataset.id, newIndex < oldIndex ? 'up' : 'down', Math.abs(newIndex - oldIndex));
            loadData();
        }
    });

    // API chỉ đổi 1 bước mỗi lần gọi
    async function changePosition(id, direction, steps) {
        for (let i = 0; i < steps; i++) {
            try {
                const res = await apiFetch(ENV.API.CHANGE_POSITION, { method: 'POST', params: { id, direction } });
                if (!res.ok) return console.error(`Lỗi tại bước ${i + 1}`);
            } catch (err) {
                return console.error('Lỗi kết nối API:', err);
            }
        }
    }

    async function deleteItem(id) {
        if (!confirm(`Bạn có chắc chắn muốn xóa lịch này của đơn vị ${getSite()}?`)) return;
        try {
            const res = await apiFetch(ENV.API.DELETE_CONGTAC(id), { method: 'DELETE' });
            res.ok ? loadData() : alert('Không thể xóa mục này!');
        } catch {
            alert('Lỗi kết nối khi xóa!');
        }
    }

    document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
