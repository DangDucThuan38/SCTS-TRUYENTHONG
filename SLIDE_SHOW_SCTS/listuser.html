<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tài Khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-5xl mx-auto">
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-bold text-slate-800">Quản Lý Tài Khoản</h1>
            <p class="text-slate-500 text-sm mt-1">Quản lý và phân quyền thành viên hệ thống</p>
        </div>
        <div class="flex gap-3">
            <button onclick="location.href='home.html'" class="px-4 py-2 text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition font-medium shadow-sm">← Quay lại</button>
            <button onclick="location.href='create_user.html'" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium shadow-lg shadow-blue-200 flex items-center gap-2">
                <span>+</span> Tạo tài khoản mới
            </button>
        </div>
    </div>

    <div class="glass-card border border-slate-200 rounded-2xl shadow-xl overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-slate-50 border-b border-slate-200">
                    <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Tên Đăng Nhập</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider text-center">Vai Trò (Role)</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">Thao tác</th>
                </tr>
            </thead>
            <tbody id="user-list" class="divide-y divide-slate-100"></tbody>
        </table>

        <div id="loading-state" class="py-20 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-4"></div>
            <p class="text-slate-400">Đang tải danh sách...</p>
        </div>
    </div>
</div>

<script src="env.js"></script>
<script src="common.js"></script>
<script>
    const currentUser = requireAuth(['1']);

    const userRow = (u) => {
        const isMe = u.ten === currentUser.ten;
        const roleClass = String(u.role) === '1' ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-600';
        return `
        <tr class="hover:bg-slate-50/80 transition-colors">
            <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">${(u.ten || 'U').charAt(0).toUpperCase()}</div>
                    <span class="font-semibold text-slate-700">${u.ten}</span>
                    ${isMe ? '<span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium">Bạn</span>' : ''}
                </div>
            </td>
            <td class="px-6 py-4 text-center">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${roleClass}">${roleName(u.role)}</span>
            </td>
            <td class="px-6 py-4 text-right">
                ${isMe
                    ? '<span class="text-slate-400 text-xs italic">Đang hoạt động</span>'
                    : `<button onclick="deleteUser('${u.ten}')" class="text-sm font-medium text-red-500 hover:text-red-700 hover:underline transition">Xóa tài khoản</button>`}
            </td>
        </tr>`;
    };

    async function fetchUsers() {
        const tbody = document.getElementById('user-list');
        const loading = document.getElementById('loading-state');
        try {
            const res = await apiFetch(ENV.API.GET_ACCOUNTS);
            if (!res.ok) throw new Error('Không thể tải dữ liệu');
            const users = await res.json();

            loading.style.display = 'none';
            tbody.innerHTML = users.length
                ? users.map(userRow).join('')
                : `<tr><td colspan="3" class="px-6 py-10 text-center text-slate-400">Chưa có tài khoản nào khác trong site này.</td></tr>`;
        } catch (err) {
            console.error(err);
            loading.innerHTML = '<p class="text-red-500">Lỗi kết nối Server!</p>';
        }
    }

    async function deleteUser(username) {
        if (!confirm(`Xác nhận xóa tài khoản "${username}"?`)) return;
        try {
            const res = await apiFetch(ENV.API.DELETE_USER(username), { method: 'DELETE' });
            if (res.ok) {
                alert('Xóa thành công!');
                fetchUsers();
            } else {
                const err = await res.json();
                alert(err.message || 'Không thể xóa tài khoản này!');
            }
        } catch {
            alert('Lỗi kết nối server');
        }
    }

    if (currentUser) fetchUsers();
</script>
</body>
</html>
