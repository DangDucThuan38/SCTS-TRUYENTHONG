<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Quân Số</title>
    <style>
        :root { --primary-color: #2563eb; --bg-color: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #1e293b; text-align: center; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }
        .status-box { display: none; padding: 12px; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; text-align: center; font-weight: 500; }
        .status-box.ok  { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
        .status-box.err { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #475569; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; font-family: inherit; transition: border-color 0.2s; }
        textarea { font-size: 0.9rem; resize: none; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .button-container { display: flex; gap: 12px; margin-top: 25px; width: 100%; }
        .btn { flex: 1; padding: 14px 20px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        .btn-save { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(37,99,235,0.2); }
        .btn-back { background-color: #64748b; color: white; }
        .footer-note { text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h2>Báo Cáo Quân Số</h2>
    <div id="status" class="status-box"></div>

    <div class="form-group">
        <label for="ngay">Ngày báo cáo</label>
        <input type="date" id="ngay">
    </div>
    <div class="form-group">
        <label for="tongquanso">Tổng quân số</label>
        <input type="number" id="tongquanso" placeholder="Nhập tổng số người...">
    </div>
    <div class="form-group">
        <label for="phep">Số lượng nghỉ (Phép/Tranh thủ)</label>
        <input type="number" id="phep" placeholder="Số lượng...">
    </div>
    <div class="form-group">
        <label for="phepNote">Chi tiết người nghỉ</label>
        <textarea id="phepNote" rows="3" placeholder="Ghi chú người nghỉ..."></textarea>
    </div>
    <div class="form-group">
        <label for="online">Có mặt trực tiếp</label>
        <input type="number" id="online" placeholder="Số lượng hiện diện...">
    </div>

    <div class="button-container">
        <button class="btn btn-back" onclick="location.href='home.html'">Quay Lại</button>
        <button id="btnSave" class="btn btn-save" onclick="saveQuanSo()">Lưu Dữ Liệu</button>
    </div>
    <p class="footer-note">Hệ thống quản lý nội bộ SCTS</p>
</div>

<script src="env.js"></script>
<script src="common.js"></script>
<script>
    const $ = (id) => document.getElementById(id);
    const FIELDS = ['tongquanso', 'phep', 'phepNote', 'online'];

    // Role 3 (media) không được vào trang này
    const user = requireAuth(['1', '2', '4']);

    $('ngay').value = new Date().toISOString().split('T')[0];

    function showStatus(message, isSuccess) {
        const el = $('status');
        el.style.display = 'block';
        el.className = `status-box ${isSuccess ? 'ok' : 'err'}`;
        el.innerText = message;
        if (isSuccess) setTimeout(() => el.style.display = 'none', 4000);
    }

    async function loadCurrentData() {
        try {
            const res = await apiFetch(ENV.API.GET_QUANSO);
            if (!res.ok) return;
            const data = await res.json();
            if (data) FIELDS.forEach(f => $(f).value = data[f] || '');
        } catch (err) {
            console.error('Lỗi tải dữ liệu:', err);
        }
    }

    async function saveQuanSo() {
        const body = { ngay: $('ngay').value };
        FIELDS.forEach(f => body[f] = $(f).value);

        if (!body.tongquanso) return showStatus('⚠️ Vui lòng nhập Tổng quân số!', false);

        const btn = $('btnSave');
        btn.disabled = true;
        showStatus('⏳ Đang lưu dữ liệu...', true);

        try {
            const res = await apiFetch(ENV.API.SAVE_QUANSO, { method: 'POST', body });
            if (res.ok) {
                showStatus('✅ Đã lưu quân số thành công!', true);
            } else {
                showStatus('❌ Lỗi: ' + ((await res.text()) || 'Không thể lưu'), false);
            }
        } catch {
            showStatus('❌ Lỗi kết nối Server!', false);
        } finally {
            btn.disabled = false;
        }
    }

    if (user) window.addEventListener('load', loadCurrentData);
</script>
</body>
</html>
