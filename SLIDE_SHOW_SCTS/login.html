<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
        .login-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <div class="login-card p-8 rounded-3xl shadow-2xl border border-white">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">Đăng Nhập</h1>
            <p class="text-slate-500 text-sm mt-1">Hệ thống quản trị nội bộ</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Mã hệ thống (Site)</label>
                <div class="relative">
                    <select id="site" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all appearance-none cursor-pointer text-slate-700"></select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Tên đăng nhập</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </span>
                    <input type="text" id="username" placeholder="Tài khoản..."
                        class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Mật khẩu</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </span>
                    <input type="password" id="password" placeholder="••••••••"
                        class="w-full pl-11 pr-11 py-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-blue-600 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <g id="eye-on">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </g>
                            <path id="eye-off" class="hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 013.443-4.443m1.426-1.426A10.012 10.012 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21m-2.105-2.105L3 3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="message" class="hidden p-3 rounded-lg text-sm font-medium text-center"></div>

            <button onclick="handleLogin()" id="loginBtn"
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-all active:scale-[0.98] flex items-center justify-center">
                <span id="btnText">Đăng Nhập</span>
                <div id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent ml-2"></div>
            </button>
        </div>
    </div>
</div>

<script src="env.js"></script>
<script src="common.js"></script>
<script>
    const $ = (id) => document.getElementById(id);

    $('site').innerHTML = Object.entries(ENV.SITES)
        .map(([value, label]) => `<option value="${value}">${label}</option>`).join('');

    function togglePassword() {
        const input = $('password');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        $('eye-on').classList.toggle('hidden', show);
        $('eye-off').classList.toggle('hidden', !show);
    }

    function showMsg(text, isError) {
        const el = $('message');
        el.innerText = text;
        el.className = `p-3 rounded-lg text-sm font-medium text-center ${isError ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}`;
    }

    function setLoading(loading) {
        $('btnText').innerText = loading ? 'Đang xử lý...' : 'Đăng Nhập';
        $('loader').classList.toggle('hidden', !loading);
        $('loginBtn').disabled = loading;
    }

    async function handleLogin() {
        const site = $('site').value.trim();
        const ten = $('username').value.trim();
        const matKhau = $('password').value.trim();

        if (!site || !ten || !matKhau) return showMsg('Vui lòng nhập đầy đủ thông tin!', true);

        $('message').classList.add('hidden');
        setLoading(true);

        try {
            const res = await apiFetch(ENV.API.LOGIN, { method: 'POST', body: { site, ten, matKhau }, withSite: false });
            const result = await res.json();

            if (!res.ok) return showMsg(result.message || 'Tài khoản hoặc mật khẩu không đúng', true);

            showMsg('Đăng nhập thành công!', false);
            if (result.user) localStorage.setItem('currentUser', JSON.stringify(result.user));
            setTimeout(() => location.href = 'home.html', 800);
        } catch (err) {
            console.error(err);
            showMsg('Không thể kết nối đến máy chủ!', true);
        } finally {
            setLoading(false);
        }
    }

    document.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
